<!DOCTYPE html>
<html lang="en" data-mode="slime">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DigiFidget</title>
<style>
/* bundled by scripts/copy-vendor.js so the app works offline */
@font-face{font-family:"Fredoka";font-weight:400;font-display:swap;src:url(vendor/fonts/fredoka-400.woff2) format("woff2")}
@font-face{font-family:"Fredoka";font-weight:500;font-display:swap;src:url(vendor/fonts/fredoka-500.woff2) format("woff2")}
@font-face{font-family:"Fredoka";font-weight:600;font-display:swap;src:url(vendor/fonts/fredoka-600.woff2) format("woff2")}
:root{
  --surface:#F7F4FB; --ink:#2A2438; --muted:#6E6680; --line:rgba(42,36,56,.12);
  --sheet:#D9E9F4; --sheet-line:rgba(70,120,160,.10);
  --slimebg:#E62A64;
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --surface:#231F30; --ink:#F1EDF8; --muted:#A79FBB; --line:rgba(255,255,255,.1);
    --sheet:#17222E; --sheet-line:rgba(150,200,240,.07); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --surface:#231F30; --ink:#F1EDF8; --muted:#A79FBB; --line:rgba(255,255,255,.1);
  --sheet:#17222E; --sheet-line:rgba(150,200,240,.07); color-scheme:dark;
}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);background:var(--slimebg);transition:background .3s}
html[data-mode="board"]{background:var(--boardbg,#A86A36)}
html[data-mode="bubbles"]{background:var(--sheetbg,var(--sheet))}
html[data-mode="dice"]{background:#3A2212}
html[data-mode="grass"]{background:var(--grassbg,#3F8226)}
*,*::before,*::after{box-sizing:inherit}
body{
  height:100%; margin:0; overflow:hidden; overscroll-behavior:none; color:var(--ink); background:transparent;
  font-family:"Fredoka",ui-rounded,"SF Pro Rounded","Segoe UI",system-ui,sans-serif;
  -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none; -webkit-touch-callout:none;
}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid #4057F5;outline-offset:3px}
#app{position:relative;height:100%}
.mode{position:absolute;inset:0;display:none}
.mode.active{display:block}

/* ---------- menu ---------- */
.fab{
  position:fixed; z-index:20; left:14px; top:calc(env(safe-area-inset-top,0px) + 12px);
  width:48px; height:48px; border-radius:16px; border:0; cursor:pointer;
  background:rgba(255,255,255,.72); -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px);
  box-shadow:0 2px 10px rgba(0,0,0,.18); display:grid; place-items:center;
}
.fab svg{width:22px;height:22px;stroke:#2A2438;stroke-width:2.4;stroke-linecap:round}
.scrim{position:fixed;inset:0;z-index:30;background:rgba(20,14,30,.4);opacity:0;pointer-events:none;transition:opacity .25s}
.scrim.open{opacity:1;pointer-events:auto}
.drawer{
  position:fixed; z-index:40; top:0; bottom:0; left:0; width:min(300px,82vw);
  background:var(--surface); color:var(--ink);
  padding:calc(env(safe-area-inset-top,0px) + 22px) 18px calc(env(safe-area-inset-bottom,0px) + 18px);
  transform:translateX(-104%); transition:transform .3s cubic-bezier(.3,1.2,.4,1);
  display:flex; flex-direction:column; gap:6px; box-shadow:6px 0 30px rgba(0,0,0,.25);
  border-radius:0 28px 28px 0; visibility:hidden;
}
.drawer.open{transform:none;visibility:visible}
.drawer h2{font-size:1.7rem;font-weight:600;margin:0 6px 14px}
.mode-btn{
  display:flex; align-items:center; gap:14px; width:100%; text-align:left; cursor:pointer;
  background:transparent; border:0; border-radius:18px; padding:10px 10px; font-size:1.15rem; font-weight:500;
}
.mode-btn[aria-current="true"]{background:var(--line)}
.ico{width:44px;height:44px;border-radius:14px;flex:none}
.ico.slime{background:radial-gradient(circle at 35% 30%,#FFD0E6,#FF7AB6 55%,#D9478C);border-radius:46% 54% 40% 60%/55% 45% 55% 45%}
.ico.board{background:repeating-linear-gradient(92deg,rgba(90,50,20,.18) 0 2px,transparent 2px 7px),#C48650;position:relative}
.ico.board::after{content:"";position:absolute;inset:11px;border-radius:50%;background:radial-gradient(circle at 38% 30%,#FF9A8A,#E8301E 50%,#A8140A);box-shadow:0 3px 0 #6E0A03}
.ico.bubbles{background:radial-gradient(circle at 35% 30%,#fff 0 10%,transparent 12%),radial-gradient(circle,#BFE0F4 0 55%,#7FB6DD);border-radius:50%}
.drawer .sub{margin:18px 6px 8px;font-size:.95rem;color:var(--muted);font-weight:500}
.swatches{display:flex;gap:10px;padding:0 6px}
.sw{width:40px;height:40px;border-radius:50%;border:3px solid transparent;cursor:pointer;background:var(--c);box-shadow:inset 0 -4px 0 rgba(0,0,0,.15)}
.sw[aria-pressed="true"]{border-color:var(--ink)}
.drawer .modes{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:6px;margin:0 -6px;padding:0 6px 8px;scrollbar-width:none}
.drawer .modes::-webkit-scrollbar{display:none}
.pill{border:0;border-radius:999px;padding:10px 18px;background:var(--line);cursor:pointer;font-weight:500;align-self:flex-start;margin-left:6px}
.drawer .note{font-size:.85rem;color:var(--muted);margin:10px 6px 0;line-height:1.4}

/* ---------- slime ---------- */
#slime,#dicecv,#grasscv{position:fixed;top:0;left:0;width:100%;height:100%;display:block;touch-action:none}
.hint{
  position:absolute; left:0; right:0; bottom:152px; text-align:center; margin:0; pointer-events:none;
  font-size:1.05rem; font-weight:500; color:rgba(255,255,255,.92); text-shadow:0 1px 6px rgba(0,0,0,.25);
  transition:opacity .6s;
}
.hint.gone{opacity:0}

.toppings{position:absolute;z-index:4;left:50%;bottom:16px;transform:translateX(-50%);display:flex;gap:4px;padding:6px;border-radius:24px;
  background:rgba(255,255,255,.74);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);box-shadow:0 4px 18px rgba(0,0,0,.22)}
.top-btn{border:0;background:transparent;border-radius:18px;padding:6px 8px 5px;min-width:64px;cursor:pointer;color:#2A2438;
  display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.78rem;font-weight:500}
.top-btn:active{background:rgba(42,36,56,.1);transform:scale(.94)}
.top-btn svg{width:30px;height:30px;display:block}
.slime-colors{position:absolute;z-index:4;left:50%;bottom:98px;transform:translateX(-50%);padding:7px 10px;border-radius:999px;
  background:rgba(255,255,255,.74);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);box-shadow:0 4px 18px rgba(0,0,0,.2)}
.slime-colors .sw{width:34px;height:34px;border-color:rgba(255,255,255,.9)}
.slime-colors .sw[aria-pressed="true"]{border-color:#2A2438;transform:scale(1.1)}
.pills{display:flex;gap:8px;flex-wrap:wrap;margin-left:6px}
.pills .pill{margin-left:0}

/* ---------- board ---------- */
#mode-board{overflow-y:auto;-webkit-overflow-scrolling:touch}
.plank{position:relative; min-height:100%; padding:84px 18px 48px; background:var(--plank-bg);}
.screw{position:absolute;width:16px;height:16px;border-radius:50%;
  background:linear-gradient(45deg,transparent 44%,rgba(40,40,40,.7) 44% 56%,transparent 56%),var(--screw-face);
  box-shadow:0 2px 2px rgba(0,0,0,.35)}
.screw.a{top:calc(env(safe-area-inset-top,0px) * 0 + 16px);right:16px}.screw.b{bottom:16px;left:16px}.screw.c{bottom:16px;right:16px}
.grid{max-width:420px;margin:0 auto;display:grid;gap:34px}
.center{display:flex;justify-content:center;align-items:center;gap:22px}

.plank[data-theme="wood"]{
  --plank-bg:radial-gradient(ellipse 60px 16px at 78% 22%,rgba(80,40,12,.28),transparent 70%),radial-gradient(ellipse 44px 12px at 18% 64%,rgba(80,40,12,.24),transparent 70%),radial-gradient(ellipse 50px 14px at 70% 86%,rgba(80,40,12,.2),transparent 70%),repeating-linear-gradient(93deg,rgba(90,48,18,.10) 0 2px,transparent 2px 11px),repeating-linear-gradient(87deg,rgba(255,226,180,.08) 0 1px,transparent 1px 27px),repeating-linear-gradient(90deg,rgba(70,35,10,.07) 0 30px,transparent 30px 74px),linear-gradient(180deg,#C98B52,#B97A42 35%,#C68752 65%,#AD6D38);
  --plate-bg:linear-gradient(160deg,#FFFDF7,#E9E1D0); --plate-edge:rgba(70,36,10,.45); --plate-hi:#fff; --plate-ring:transparent;
  --screw-face:radial-gradient(circle at 35% 30%,#fff,#BDB6A6); --slot-bg:#CFC6B2;
  --lever-c1:#FFFFFF; --lever-c2:#E2DBCB; --lever-c3:#C9C0AD;
  --led-off:#5A3E28; --led-on:#FFE36B; --led-glow:rgba(255,220,90,.7);
  --dot-off:rgba(55,26,6,.5); --dot-on:#7DF0C4; --dot-glow:rgba(110,240,190,.65);
  --knob-side:#141416; --ridge-a:#2A2A2E; --ridge-b:#45454B; --cap-bg:radial-gradient(circle at 40% 30%,#7A7A82,#3A3A40 60%,#232327); --pointer:#F2F2F2; --pointer-glow:none;
  --fader-bg:repeating-linear-gradient(90deg,#CDD0D5 0 1px,#BABEC4 1px 3px); --fader-edge:rgba(60,30,8,.45); --tick:rgba(0,0,0,.45); --track:#2A2A2E;
  --fcap-bg:linear-gradient(90deg,#26262A,#56565C 40%,#2E2E33 60%,#1F1F23); --fcap-side:#0E0E10; --fcap-line:#F2F2F2;
  --bezel-bg:radial-gradient(circle at 35% 28%,#F5F6F7,#AEB2B7 55%,#6C7177); --bezel-ring:transparent;
  --red-bg:radial-gradient(circle at 38% 28%,#FFB2A6 0 7%,#F5402B 32%,#C11B0D 78%,#940F05); --red-side:#6E0A03; --red-glow:255,70,40;
  --k1:#F7F7F2;--k1d:#BDB8AC;--k2:#3B5BDB;--k2d:#22379A;--k3:#2FBF8F;--k3d:#1A8361;--k4:#FFC93C;--k4d:#C48E0B;
}
.plank[data-theme="cute"]{
  --plank-bg:radial-gradient(circle,rgba(255,255,255,.6) 0 3px,transparent 3.5px) 0 0/30px 30px,radial-gradient(circle,rgba(255,255,255,.4) 0 2px,transparent 2.5px) 15px 15px/30px 30px,linear-gradient(180deg,#FFC6DD,#FFB0CF 50%,#FFC2DA);
  --plate-bg:linear-gradient(160deg,#FFFFFF,#FFE6F0); --plate-edge:rgba(214,92,140,.45); --plate-hi:#fff; --plate-ring:transparent;
  --screw-face:radial-gradient(circle at 35% 30%,#fff,#FFB3CF); --slot-bg:#FFD3E4;
  --lever-c1:#FFE8F1; --lever-c2:#FF9CC2; --lever-c3:#F06A9E;
  --led-off:#E8A5BF; --led-on:#FF4F93; --led-glow:rgba(255,80,150,.75);
  --dot-off:rgba(200,90,140,.3); --dot-on:#FF6FA5; --dot-glow:rgba(255,111,165,.75);
  --knob-side:#C46A9A; --ridge-a:#F6C3DD; --ridge-b:#EAA3CA; --cap-bg:radial-gradient(circle at 40% 30%,#FFFFFF,#FFE6F1 60%,#F7C6DE); --pointer:#FF4F93; --pointer-glow:none;
  --fader-bg:linear-gradient(180deg,#F6EBFF,#E7D5FA); --fader-edge:rgba(170,110,200,.45); --tick:rgba(170,90,170,.45); --track:#C7A6E0;
  --fcap-bg:linear-gradient(90deg,#FF8DB8,#FFD3E6 45%,#FF8DB8); --fcap-side:#D9649A; --fcap-line:#fff;
  --bezel-bg:radial-gradient(circle at 35% 28%,#FFFFFF,#FFE0EC 55%,#F5B5CF); --bezel-ring:transparent;
  --red-bg:radial-gradient(circle at 38% 28%,#FFE3EE 0 7%,#FF5C9D 32%,#E3307A 78%,#B81E5E); --red-side:#8E1447; --red-glow:255,90,160;
  --k1:#A8EBD0;--k1d:#6CC7A4;--k2:#A9D8FF;--k2d:#6FAEE6;--k3:#FFF1A0;--k3d:#E0C85A;--k4:#D6C2FF;--k4d:#A88BE0;
}
.plank[data-theme="blue"]{
  --plank-bg:repeating-linear-gradient(90deg,rgba(255,255,255,.04) 0 1px,transparent 1px 4px),radial-gradient(ellipse at 50% 20%,#2A64C2,#173E82 60%,#11306A);
  --plate-bg:linear-gradient(160deg,#F3F8FF,#D6E6F8); --plate-edge:rgba(5,22,60,.55); --plate-hi:#fff; --plate-ring:transparent;
  --screw-face:radial-gradient(circle at 35% 30%,#fff,#9FB6D3); --slot-bg:#B9CDE6;
  --lever-c1:#FFFFFF; --lever-c2:#D3E3F7; --lever-c3:#A9C3E6;
  --led-off:#29406A; --led-on:#5FE3FF; --led-glow:rgba(95,227,255,.8);
  --dot-off:rgba(5,20,50,.5); --dot-on:#7FD8FF; --dot-glow:rgba(127,216,255,.75);
  --knob-side:#0A1A3A; --ridge-a:#12285A; --ridge-b:#1D3A78; --cap-bg:radial-gradient(circle at 40% 30%,#5577BD,#1F3C7A 60%,#132A5C); --pointer:#BFE9FF; --pointer-glow:none;
  --fader-bg:repeating-linear-gradient(90deg,#C9D8EA 0 1px,#B4C7DE 1px 3px); --fader-edge:rgba(5,20,50,.5); --tick:rgba(10,30,70,.5); --track:#0E2350;
  --fcap-bg:linear-gradient(90deg,#123068,#3B64B8 40%,#1B3F86 60%,#0F275A); --fcap-side:#081A40; --fcap-line:#BFE9FF;
  --bezel-bg:radial-gradient(circle at 35% 28%,#F2F7FF,#A8BCD8 55%,#5F7598); --bezel-ring:transparent;
  --red-bg:radial-gradient(circle at 38% 28%,#D8F2FF 0 7%,#2F8CFF 32%,#1559CC 78%,#0B3C99); --red-side:#062A6E; --red-glow:70,150,255;
  --k1:#F4F8FF;--k1d:#B3C3DA;--k2:#7CC4FF;--k2d:#3E8AD0;--k3:#2EC4C4;--k3d:#178C8C;--k4:#2B4C9B;--k4d:#162E66;
}
.plank[data-theme="scifi"]{
  --plank-bg:linear-gradient(rgba(0,255,224,.07) 1px,transparent 1px) 0 0/24px 24px,linear-gradient(90deg,rgba(0,255,224,.07) 1px,transparent 1px) 0 0/24px 24px,radial-gradient(ellipse at 50% 25%,#1C2638,#0B0F17 70%);
  --plate-bg:linear-gradient(160deg,#2A3140,#161B25); --plate-edge:rgba(0,0,0,.65); --plate-hi:rgba(0,255,224,.45); --plate-ring:rgba(0,255,224,.3);
  --screw-face:radial-gradient(circle at 35% 30%,#9AA6B8,#3C4555); --slot-bg:#06090E;
  --lever-c1:#F0F4FA; --lever-c2:#9AA6B8; --lever-c3:#5E6878;
  --led-off:#1E2A30; --led-on:#00FFE0; --led-glow:rgba(0,255,224,.85);
  --dot-off:rgba(0,255,224,.12); --dot-on:#00FFE0; --dot-glow:rgba(0,255,224,.85);
  --knob-side:#000; --ridge-a:#11151C; --ridge-b:#202835; --cap-bg:radial-gradient(circle at 40% 30%,#3A4352,#151A22 60%,#0A0D12); --pointer:#00FFE0; --pointer-glow:0 0 8px #00FFE0;
  --fader-bg:linear-gradient(180deg,#1C222D,#11151C); --fader-edge:rgba(0,0,0,.65); --tick:rgba(0,255,224,.6); --track:#000;
  --fcap-bg:linear-gradient(90deg,#2A3240,#55607A 40%,#2E3644 60%,#1A1F28); --fcap-side:#07090D; --fcap-line:#FF3DCB;
  --bezel-bg:radial-gradient(circle at 35% 28%,#4A5568,#232A36 55%,#0E1218); --bezel-ring:rgba(0,255,224,.55);
  --red-bg:radial-gradient(circle at 38% 28%,#FFE3F6 0 7%,#FF2E9A 32%,#C4007A 78%,#7A004C); --red-side:#4A002E; --red-glow:255,46,154;
  --k1:#00E5D4;--k1d:#008C82;--k2:#FF3DCB;--k2d:#A0197F;--k3:#A6FF3D;--k3d:#5FA81A;--k4:#FFB020;--k4d:#B36F00;
}
.themes{position:absolute;top:16px;left:72px;right:12px;display:flex;justify-content:flex-end;gap:6px;overflow-x:auto;scrollbar-width:none}
.theme,.season{flex:none;border:0;border-radius:999px;padding:6px 10px 6px 6px;display:flex;align-items:center;gap:6px;cursor:pointer;
  font-size:.82rem;font-weight:500;color:#2A2438;background:rgba(255,255,255,.78);box-shadow:0 2px 6px rgba(0,0,0,.2)}
.theme[aria-pressed="true"],.season[aria-pressed="true"]{background:#2A2438;color:#fff}
.theme i,.season i{width:18px;height:18px;border-radius:50%;display:block;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.7)}

.bezel{width:178px;height:178px;border-radius:50%;display:grid;place-items:center;background:var(--bezel-bg);
  box-shadow:0 8px 14px rgba(40,18,4,.45), inset 0 -4px 8px rgba(0,0,0,.3), inset 0 3px 3px rgba(255,255,255,.7), 0 0 0 3px var(--bezel-ring), 0 0 18px var(--bezel-ring)}
.red{width:124px;height:124px;border-radius:50%;border:0;cursor:pointer;touch-action:none;margin-top:-10px;background:var(--red-bg);
  box-shadow:0 12px 0 var(--red-side), inset 0 -8px 12px rgba(0,0,0,.25);
  animation:blink 1.4s ease-in-out infinite; transition:transform .05s}
@keyframes blink{
  0%,100%{filter:brightness(.92);box-shadow:0 12px 0 var(--red-side), inset 0 -8px 12px rgba(0,0,0,.25), 0 0 0 0 rgba(var(--red-glow),0)}
  50%{filter:brightness(1.3);box-shadow:0 12px 0 var(--red-side), inset 0 -8px 12px rgba(0,0,0,.15), 0 0 34px 8px rgba(var(--red-glow),.55)}
}
.red.down{animation:none;transform:translateY(10px);filter:brightness(1.5);
  box-shadow:0 2px 0 var(--red-side), inset 0 -4px 8px rgba(0,0,0,.2), 0 0 50px 14px rgba(var(--red-glow),.75)}

.plate{position:relative;width:78px;height:118px;border-radius:12px;display:grid;place-items:center;background:var(--plate-bg);
  box-shadow:0 5px 0 var(--plate-edge), 0 10px 14px rgba(0,0,0,.25), inset 0 1px 0 var(--plate-hi), 0 0 0 1px var(--plate-ring)}
.plate::before,.plate::after{content:"";position:absolute;left:50%;margin-left:-5px;width:10px;height:10px;border-radius:50%;
  background:linear-gradient(90deg,transparent 42%,rgba(0,0,0,.45) 42% 58%,transparent 58%),var(--screw-face);}
.plate::before{top:7px}.plate::after{bottom:7px}
.slot{width:34px;height:58px;border-radius:8px;background:var(--slot-bg);box-shadow:inset 0 3px 5px rgba(0,0,0,.35);display:grid;place-items:center;perspective:160px}
.lever{width:24px;height:50px;border:0;border-radius:7px;cursor:pointer;padding:0;
  background:linear-gradient(180deg,var(--lever-c1),var(--lever-c2) 55%,var(--lever-c3));
  transform:rotateX(-34deg);transform-origin:50% 50%;
  box-shadow:0 8px 6px -2px rgba(0,0,0,.35);transition:transform .12s cubic-bezier(.5,1.7,.5,1)}
.lever[aria-checked="true"]{transform:rotateX(34deg);background:linear-gradient(0deg,var(--lever-c1),var(--lever-c2) 55%,var(--lever-c3));box-shadow:0 -6px 6px -2px rgba(0,0,0,.3)}
.led{position:absolute;top:-16px;left:50%;margin-left:-6px;width:12px;height:12px;border-radius:50%;background:var(--led-off);box-shadow:inset 0 1px 2px rgba(0,0,0,.5);transition:all .1s}
.led.on{background:var(--led-on);box-shadow:0 0 12px 4px var(--led-glow)}

.knob-wrap{position:relative;width:150px;height:150px}
.dot{position:absolute;width:9px;height:9px;border-radius:50%;background:var(--dot-off);box-shadow:inset 0 1px 2px rgba(0,0,0,.4);transition:background .08s,box-shadow .08s}
.dot.on{background:var(--dot-on);box-shadow:0 0 8px 2px var(--dot-glow)}
.knob3d{position:absolute;left:50%;top:50%;width:98px;height:98px;margin:-49px 0 0 -49px;border-radius:50%;cursor:grab;touch-action:none;
  box-shadow:0 9px 0 var(--knob-side), 0 14px 14px rgba(0,0,0,.45)}
.ridges{position:absolute;inset:0;border-radius:50%;transform:rotate(var(--r,-135deg));
  background:repeating-conic-gradient(var(--ridge-a) 0 5deg,var(--ridge-b) 5deg 10deg)}
.cap{position:absolute;inset:11px;border-radius:50%;background:var(--cap-bg);box-shadow:inset 0 2px 2px rgba(255,255,255,.25),0 2px 4px rgba(0,0,0,.5)}
.pointer{position:absolute;inset:11px;border-radius:50%;transform:rotate(var(--r,-135deg))}
.pointer::after{content:"";position:absolute;left:50%;top:6px;width:6px;height:22px;margin-left:-3px;border-radius:3px;background:var(--pointer);box-shadow:var(--pointer-glow)}

.fader{position:relative;height:84px;border-radius:14px;touch-action:none;cursor:pointer;background:var(--fader-bg);
  box-shadow:0 5px 0 var(--fader-edge),0 9px 12px rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.5), 0 0 0 1px var(--plate-ring)}
.fader::before{content:"";position:absolute;left:32px;right:32px;top:12px;height:10px;
  background:repeating-linear-gradient(90deg,var(--tick) 0 2px,transparent 2px calc((100% - 2px)/15))}

<div id="app">

      <button class="top-btn" data-top="marble" aria-label="Add candy marbles"><svg viewBox="0 0 30 30"><defs><radialGradient id="mg1" cx=".35" cy=".3" r=".75"><stop offset="0" stop-color="#fff"/><stop offset=".25" stop-color="#3E8BFF"/><stop offset="1" stop-color="#1A4FBF"/></radialGradient><radialGradient id="mg2" cx=".35" cy=".3" r=".75"><stop offset="0" stop-color="#fff"/><stop offset=".25" stop-color="#FFD23F"/><stop offset="1" stop-color="#D29A06"/></radialGradient></defs><circle cx="11" cy="17" r="8" fill="url(#mg1)"/><circle cx="21" cy="12" r="6.5" fill="url(#mg2)"/></svg>Marbles</button>

  <section class="mode" id="mode-board" aria-label="Board">

    </div>
  </section>
</div>

function buildGeo(def) {

function faceMat(def, fi, col) {
  const Sz = 256, c = document.createElement("canvas"); c.width = c.height = Sz;
  const g = c.getContext("2d");
  g.fillStyle = col.body; g.fillRect(0, 0, Sz, Sz);
  const U = def.uvs[fi].map(([u, v]) => [u * Sz, (1 - v) * Sz]);
  g.beginPath(); U.forEach(([x, y], i) => i ? g.lineTo(x, y) : g.moveTo(x, y)); g.closePath();
  g.lineJoin = "round";
  g.strokeStyle = "rgba(255,255,255,.25)"; g.lineWidth = Sz * .08; g.stroke();
  g.strokeStyle = "rgba(0,0,0,.28)"; g.lineWidth = Sz * .018; g.stroke();
  let inr = 1e9;
  for (let i = 0; i < U.length; i++) {
    const [x1, y1] = U[i], [x2, y2] = U[(i + 1) % U.length];
    const d = Math.abs((y2 - y1) * (Sz / 2) - (x2 - x1) * (Sz / 2) + x2 * y1 - y2 * x1) / Math.hypot(x2 - x1, y2 - y1);
    inr = Math.min(inr, d);

  g.fillStyle = col.ink; g.textAlign = "center"; g.textBaseline = "middle";
  const fam = "Fredoka, ui-rounded, system-ui, sans-serif";
  if (def.type === "d4") {
    def.faces[fi].forEach((vi, j) => {
      const [x, y] = U[j], px = Sz / 2 + (x - Sz / 2) * .55, py = Sz / 2 + (y - Sz / 2) * .55;
      g.save(); g.translate(px, py); g.rotate(Math.atan2(x - Sz / 2, -(y - Sz / 2)));
      g.font = `600 ${inr * .78}px ${fam}`; g.fillText(def.vertVals[vi], 0, 0); g.restore();
    });
  } else {
    const lab = String(def.vals[fi]);
    const fs = inr * (lab.length > 1 ? 1.0 : 1.2) * (def.type === "d6" ? .95 : 1);
    g.font = `600 ${fs}px ${fam}`; g.fillText(lab, Sz / 2, Sz / 2 + fs * .04);
    if (lab === "6" || lab === "9") g.fillRect(Sz / 2 - fs * .2, Sz / 2 + fs * .43, fs * .4, fs * .07);
  }
  const tex = new THREE.CanvasTexture(c); tex.encoding = THREE.sRGBEncoding; tex.anisotropy = 4;
  return new THREE.MeshStandardMaterial({ map: tex, roughness: .28, metalness: .04 });
}

function assets(type) {
  if (!D.defs[type]) {
    const def = dieDef(type); D.defs[type] = def; D.geos[type] = buildGeo(def);
    D.mats[type] = def.faces.map((_, i) => faceMat(def, i, DCOL[type]));

function diceError(e) {

}

}
async function initDiceInner() {
  if (D.ready) { D.last = 0; diceResize(); return; }
  if (D.loading) return;
  const msg = $("#diceMsg");
  if (typeof THREE === "undefined" || typeof CANNON === "undefined") {
    msg.hidden = false; msg.textContent = "The 3D engine didn’t load. Check your connection, then reopen Dice."; return;
  }
  msg.hidden = true; D.loading = true;
  try { await Promise.race([document.fonts.load("600 64px Fredoka"), new Promise(res => setTimeout(res, 800))]); } catch (e) {}
  const cvs = $("#dicecv");
  let r;
  try { r = new THREE.WebGLRenderer({ canvas: cvs, antialias: true, powerPreference: "high-performance" }); }
  catch (e) { r = new THREE.WebGLRenderer({ canvas: cvs, antialias: false, precision: "mediump" }); }
  r.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  r.shadowMap.enabled = true; r.shadowMap.type = THREE.PCFSoftShadowMap; r.outputEncoding = THREE.sRGBEncoding;
  const scene = new THREE.Scene(); scene.background = new THREE.Color("#1F4F3D");
  const cam = new THREE.PerspectiveCamera(40, 1, .1, 300);
  scene.add(new THREE.HemisphereLight(0xfff4e2, 0x1c2c25, .8));
  const sun = new THREE.DirectionalLight(0xffffff, .95);
  sun.position.set(-6, 20, 9); sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
  Object.assign(sun.shadow.camera, { left: -16, right: 16, top: 16, bottom: -16, near: 1, far: 60 });
  sun.shadow.bias = -.0008; scene.add(sun);
  const fc = document.createElement("canvas"); fc.width = fc.height = 256;
  const fg = fc.getContext("2d"); fg.fillStyle = "#2C6E53"; fg.fillRect(0, 0, 256, 256);
  for (let i = 0; i < 6000; i++) { fg.fillStyle = Math.random() < .5 ? "rgba(255,255,255,.05)" : "rgba(0,0,0,.09)"; fg.fillRect(Math.random() * 256, Math.random() * 256, 1.5, 1.5); }
  const ft = new THREE.CanvasTexture(fc); ft.wrapS = ft.wrapT = THREE.RepeatWrapping; ft.repeat.set(24, 24); ft.encoding = THREE.sRGBEncoding;
  const table = new THREE.Mesh(new THREE.PlaneGeometry(90, 90), new THREE.MeshStandardMaterial({ map: ft, roughness: 1 }));
  table.rotation.x = -Math.PI / 2; table.receiveShadow = true; scene.add(table);

  const world = new CANNON.World(); world.gravity.set(0, -34, 0);
  world.broadphase = new CANNON.NaiveBroadphase(); world.solver.iterations = 14; world.allowSleep = true;
  const mDice = new CANNON.Material("dice"), mFloor = new CANNON.Material("floor"), mWall = new CANNON.Material("wall");
  world.addContactMaterial(new CANNON.ContactMaterial(mDice, mFloor, { friction: .35, restitution: .3 }));
  world.addContactMaterial(new CANNON.ContactMaterial(mDice, mDice, { friction: .15, restitution: .45 }));
  world.addContactMaterial(new CANNON.ContactMaterial(mDice, mWall, { friction: .05, restitution: .55 }));
  const floor = new CANNON.Body({ mass: 0, material: mFloor }); floor.addShape(new CANNON.Plane());
  floor.quaternion.setFromAxisAngle(new CANNON.Vec3(1, 0, 0), -Math.PI / 2); floor.isFloor = true; world.addBody(floor);
  const walls = [];
  for (let i = 0; i < 4; i++) { const b = new CANNON.Body({ mass: 0, material: mWall }); b.addShape(new CANNON.Plane()); b.isWall = true; world.addBody(b); walls.push(b); }
  Object.assign(D, { r, scene, cam, world, mDice, walls, defs: {}, geos: {}, mats: {}, ray: new THREE.Raycaster() });

function diceResize() {
  const c = D.r.domElement, w = c.clientWidth, h = c.clientHeight;
  if (!w || !h) return;
  D.r.setSize(w, h, false); D.cam.aspect = w / h;
  const tilt = 14 * Math.PI / 180, vh = Math.tan(20 * Math.PI / 180), hh = vh * D.cam.aspect;
  const dist = Math.max(5.6 / hh, 7 / vh);
  D.cam.position.set(0, dist * Math.cos(tilt), dist * Math.sin(tilt)); D.cam.lookAt(0, 0, 0);
  D.cam.updateProjectionMatrix(); D.cam.updateMatrixWorld();
  const onFloor = (nx, ny) => {
    const v = new THREE.Vector3(nx, ny, .5).unproject(D.cam).sub(D.cam.position).normalize();
    const t = -D.cam.position.y / v.y; return D.cam.position.clone().add(v.multiplyScalar(t));
  };
  const trayH = ($("#tray").offsetHeight || 120) - 20, hudH = 90;
  const bl = onFloor(-1, -1 + 2 * trayH / h), tl = onFloor(-1, 1 - 2 * hudH / h);
  const xh = Math.min(Math.abs(bl.x), Math.abs(tl.x)) - 1.1, zn = bl.z - 1.1, zf = tl.z + 1.1;
  D.b = { xh, zn, zf };
  const [L, R, F, N] = D.walls, Y = new CANNON.Vec3(0, 1, 0);
  L.position.set(-xh, 0, 0); L.quaternion.setFromAxisAngle(Y, Math.PI / 2);
  R.position.set(xh, 0, 0); R.quaternion.setFromAxisAngle(Y, -Math.PI / 2);
  F.position.set(0, 0, zf); F.quaternion.set(0, 0, 0, 1);
  N.position.set(0, 0, zn); N.quaternion.setFromAxisAngle(Y, Math.PI);

}
function keepInside(b) {
  const B = D.b, p = b.position;
  if (p.y < -3 || Math.abs(p.x) > B.xh + .5 || p.z < B.zf - .5 || p.z > B.zn + .5) {
    p.set(clamp(p.x, -B.xh + 1, B.xh - 1), 4, clamp(p.z, B.zf + 1, B.zn - 1)); b.velocity.set(0, 0, 0); b.wakeUp();

}

let lastClack = 0;
function onHit(d, e) {
  const now = performance.now();
  let iv = 0; try { iv = Math.abs(e.contact.getImpactVelocityAlongNormal()); } catch (_) {}
  if (iv < 1.2 || now - d.lastHit < 40) return;
  d.lastHit = now;
  const o = e.body, v = Math.min(1, iv / 16);
  if (o.isWall) S.knock(v);
  else if (o.isFloor) S.thud(v);
  else { if (now - lastClack < 25) return; lastClack = now; S.clack(v); }
  if (v > .2) buzz(Math.round(4 + v * 16));
}

function addDie(type) {
  if (!D.ready) return;
  if (D.dice.length >= 14) { const m = $("#diceMsg"); m.hidden = false; m.textContent = "The table’s full. Clear it to add more."; setTimeout(() => m.hidden = true, 1600); return; }
  const [def, geo, mats] = assets(type);
  const mesh = new THREE.Mesh(geo, mats); mesh.castShadow = true; D.scene.add(mesh);
  const body = new CANNON.Body({ mass: 1, material: D.mDice });
  body.addShape(new CANNON.ConvexPolyhedron(def.sv.map(v => new CANNON.Vec3(v[0], v[1], v[2])), def.faces.map(f => f.slice())));
  body.linearDamping = .08; body.angularDamping = .1; body.allowSleep = true; body.sleepSpeedLimit = .15; body.sleepTimeLimit = .4;
  const B = D.b;
  body.position.set(rnd(-B.xh * .6, B.xh * .6), 5, B.zn - 1);
  body.quaternion.setFromEuler(rnd(0, 6.28), rnd(0, 6.28), rnd(0, 6.28));
  body.velocity.set(rnd(-3, 3), 3, -rnd(9, 15));
  body.angularVelocity.set(rnd(-20, 20), rnd(-20, 20), rnd(-20, 20));
  const d = { type, def, mesh, body, lastHit: 0 };
  body.addEventListener("collide", e => onHit(d, e));
  D.world.addBody(body); D.dice.push(d);
  startRoll();
}
function rollBody(b) {
  b.wakeUp();
  b.velocity.set(rnd(-4, 4), rnd(10, 13), rnd(-4, 4));
  b.angularVelocity.set(rnd(-28, 28), rnd(-28, 28), rnd(-28, 28));
}
function rollAll() {
  if (!D.dice.length) return;
  // scoop every die into a "hand" at the near edge, then throw them across the table
  const B = D.b, gap = 2.3, cols = Math.max(1, Math.floor((2 * B.xh - 1) / gap));
  const depth = B.zn - B.zf;
  D.dice.forEach((d, i) => {
    const b = d.body, col = i % cols, row = Math.floor(i / cols);
    b.wakeUp();
    b.position.set((col - (Math.min(cols, D.dice.length) - 1) / 2) * gap + rnd(-.2, .2), 3, Math.max(B.zf + 1, B.zn - 1.2 - row * gap - rnd(0, .3)));
    b.quaternion.setFromEuler(rnd(0, 6.28), rnd(0, 6.28), rnd(0, 6.28));
    b.velocity.set(rnd(-4, 4), rnd(4, 7), -rnd(.9, 1.25) * Math.min(24, depth * 1.35));
    b.angularVelocity.set(rnd(-30, 30), rnd(-30, 30), rnd(-30, 30));

}
function startRoll() {
  D.rolling = true; D.settle = 0; D.rollStart = performance.now();
  $("#dTotal").textContent = "…"; $("#dCrit").textContent = ""; $("#dChips").classList.add("dim");
}
function readDie(d) {
  const q = d.mesh.quaternion;
  let best = -1e9, val = 0;
  if (d.type === "d4") {
    d.def.sv.forEach((v, i) => { const y = new THREE.Vector3(v[0], v[1], v[2]).applyQuaternion(q).y; if (y > best) { best = y; val = d.def.vertVals[i]; } });
  } else {
    d.def.normals.forEach((n, i) => { const y = new THREE.Vector3(n[0], n[1], n[2]).applyQuaternion(q).y; if (y > best) { best = y; val = d.def.vals[i]; } });
  }

function showResults() {
  const chips = $("#dChips"); chips.classList.remove("dim");
  if (!D.dice.length) { $("#dTotal").textContent = "–"; $("#dCrit").textContent = ""; chips.innerHTML = ""; return; }
  const res = D.dice.map(d => ({ type: d.type, v: readDie(d) })).sort((a, b) => DORDER.indexOf(a.type) - DORDER.indexOf(b.type));
  $("#dTotal").textContent = res.reduce((s, r) => s + r.v, 0);
  chips.innerHTML = res.map(r => `<span class="chip" style="background:${DCOL[r.type].body};color:${DCOL[r.type].ink}"><small>${r.type}</small>${r.v}</span>`).join("");
  const d20s = res.filter(r => r.type === "d20");
  const crit = $("#dCrit");
  if (d20s.some(r => r.v === 20)) { crit.textContent = "Natural 20!"; S.blip(784); setTimeout(() => S.blip(1047), 110); buzz(40); }
  else if (d20s.some(r => r.v === 1)) { crit.textContent = "Natural 1"; S.thunk(); }
  else { crit.textContent = ""; S.tick(1800, .06, .05, "sine"); }
}

function bindDicePointer(cvs) {
  const LIFT = 2.6;
  const ndc = e => { const r = cvs.getBoundingClientRect(); return new THREE.Vector2((e.clientX - r.left) / r.width * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1); };
  const planePt = e => {
    D.ray.setFromCamera(ndc(e), D.cam);
    const o = D.ray.ray.origin, dir = D.ray.ray.direction, t = (LIFT - o.y) / dir.y;
    return new THREE.Vector3(o.x + dir.x * t, LIFT, o.z + dir.z * t);
  };
  cvs.addEventListener("pointerdown", e => {
    ac(); cvs.setPointerCapture(e.pointerId);
    D.ray.setFromCamera(ndc(e), D.cam);
    const hit = D.ray.intersectObjects(D.dice.map(d => d.mesh))[0];
    if (hit) {
      const d = D.dice.find(x => x.mesh === hit.object), p = d.body.position;
      D.grab = { d, id: e.pointerId, x0: e.clientX, y0: e.clientY, t0: performance.now(), moved: false, target: new THREE.Vector3(p.x, LIFT, p.z) };
      d.body.wakeUp(); S.tick(1400, .12, .02); buzz(8);
    } else D.tap = { x0: e.clientX, y0: e.clientY };
  });
  cvs.addEventListener("pointermove", e => {
    const g = D.grab; if (!g || e.pointerId !== g.id) return;
    if (Math.hypot(e.clientX - g.x0, e.clientY - g.y0) > 8) g.moved = true;
    const p = planePt(e), B = D.b;
    p.x = clamp(p.x, -B.xh + .3, B.xh - .3); p.z = clamp(p.z, B.zf + .3, B.zn - .3);
    g.target = p;
  });
  const up = e => {
    const g = D.grab;
    if (g && e.pointerId === g.id) {
      const b = g.d.body;
      if (!g.moved && performance.now() - g.t0 < 350) { rollBody(b); S.rattle(); }
      else {
        const v = b.velocity, sp = Math.hypot(v.x, v.y, v.z);
        if (sp > 30) { const k = 30 / sp; v.x *= k; v.y *= k; v.z *= k; }
        v.y = Math.max(v.y, 3);
        b.angularVelocity.set(rnd(-25, 25), rnd(-25, 25), rnd(-25, 25));
      }
      D.grab = null; startRoll();
    } else if (D.tap && Math.hypot(e.clientX - D.tap.x0, e.clientY - D.tap.y0) < 10) rollAll();
    D.tap = null;
  };
  cvs.addEventListener("pointerup", up); cvs.addEventListener("pointercancel", up);
}

function diceFrame(now) {
  const dt = D.last ? Math.min(.05, (now - D.last) / 1000) : 1 / 60; D.last = now;
  const g = D.grab;
  if (g) {
    const b = g.d.body, t = g.target; b.wakeUp();
    const vx = (t.x - b.position.x) * 14, vy = (t.y - b.position.y) * 14, vz = (t.z - b.position.z) * 14;
    b.velocity.set(vx, vy, vz);
    b.angularVelocity.set(vz * .9 + rnd(-1, 1), b.angularVelocity.y * .9, -vx * .9 + rnd(-1, 1));
  }
  D.world.step(1 / 60, dt, 4);
  for (const d of D.dice) { keepInside(d.body); d.mesh.position.copy(d.body.position); d.mesh.quaternion.copy(d.body.quaternion); }
  if (D.rolling && !g) {
    const still = D.dice.every(d => {
      const v = d.body.velocity, w = d.body.angularVelocity;
      return d.body.sleepState === CANNON.Body.SLEEPING || (Math.hypot(v.x, v.y, v.z) < .12 && Math.hypot(w.x, w.y, w.z) < .25);
    });
    D.settle = still ? D.settle + dt : 0;
    if (now - (D.rollStart || now) > 7000) D.settle = 1; // never get stuck waiting on a jittery die
    if (D.settle > .3) { D.rolling = false; showResults(); }
  }
  D.r.render(D.scene, D.cam);
}

    c.beginPath();
    for (const f of G.flakes) {
      f.y += f.r * .35 * dt; f.ph += .02 * dt; f.x += Math.sin(f.ph) * .3 * dt;
      if (f.y > H + 5) { f.y = -5; f.x = rnd(0, W); }
      c.moveTo(f.x + f.r, f.y); c.arc(f.x, f.y, f.r, 0, 6.29);
    }
    c.fillStyle = "rgba(255,255,255,.95)"; c.fill(); c.strokeStyle = "rgba(120,150,190,.35)"; c.lineWidth = .8; c.stroke();
  }
  if (speed > 2 && now - G.snd > Math.max(50, 140 - speed * 4)) {
    G.snd = now; const v = Math.min(1, .25 + speed * .03);
    if (s === "winter") S.snow(v * .7); else if (s === "autumn") S.crunch(v * .5); else S.rustle(v);
  }
  if (speed > 3 && now - G.bz > 90) { G.bz = now; buzz(Math.min(8, 2 + speed * .1) | 0); }
}
function grassTap(x, y) {
  const s = G.season;
  if (s === "winter") { carve(x, y, x, y); S.snow(.8); buzz(10); return; }
  for (const b of G.blades) {
    const dx = b.x - x, dy = b.y - b.h * .5 - y, d2 = dx * dx + dy * dy;
    if (d2 < 4900) { const f = 1 - Math.sqrt(d2) / 70; b.va += (dx > 0 ? .2 : -.2) * f; b.pr = Math.max(b.pr, .55 * f); }
  }
  let flew = 0; const R = s === "autumn" ? 100 : 80;
  for (const p of G.parts) {
    const dx = p.x - x, dy = p.y - y, d = Math.hypot(dx, dy) || 1;
    if (d < R) {
      const f = 1 - d / R; flew++;
      if (p.kind === "leaf") kick(p, dx / d * rnd(1.5, 4), dy / d * rnd(1, 2.5), rnd(3, 5.5) + f * 3);
      else kick(p, dx / d * rnd(.5, 1.5), dy / d * rnd(.3, 1), rnd(.9, 1.6) + f);
    }
  }
  if (s === "autumn") { S.crunch(1); if (flew) S.whoosh(); buzz(flew ? 22 : 12); } else { S.rustle(1); buzz(8); }
}
gcv.addEventListener("pointerdown", e => {
  gcv.setPointerCapture(e.pointerId); ac(); gHint.classList.add("gone");
  G.ptrs.set(e.pointerId, { x: e.offsetX, y: e.offsetY, px: e.offsetX, py: e.offsetY, lx: e.offsetX, ly: e.offsetY, vx: 0, vy: 0, sp: 0 });
  grassTap(e.offsetX, e.offsetY);
});
gcv.addEventListener("pointermove", e => {
  const p = G.ptrs.get(e.pointerId); if (!p) return;
  p.x = e.offsetX; p.y = e.offsetY;
  if (G.season === "winter") { carve(p.lx, p.ly, p.x, p.y); p.lx = p.x; p.ly = p.y; }
});
const gEnd = e => G.ptrs.delete(e.pointerId);
gcv.addEventListener("pointerup", gEnd); gcv.addEventListener("pointercancel", gEnd);
function setSeason(s) {
  G.season = s; const P = SEASONS[s];
  gSec.querySelectorAll(".season").forEach(b => b.setAttribute("aria-pressed", b.dataset.season === s ? "true" : "false"));
  document.documentElement.style.setProperty("--grassbg", P.bg);
  gAct.hidden = !P.act; gAct.textContent = P.act; gHint.textContent = P.hint; gHint.classList.remove("gone");
  try { localStorage.setItem("fidget-grass-season", s); } catch (e) {}
  if (G.W) buildSeason();
}
gSec.querySelectorAll(".season").forEach(b => b.addEventListener("click", () => { setSeason(b.dataset.season); S.tick(2200, .15, .03, "square"); buzz(10); }));
gAct.addEventListener("click", () => {
  if (G.season === "winter") { paintSnow(); S.snow(1); buzz(14); }
  else { dropLeaves(24); S.whoosh(); buzz(10); }
});
let savedSeason = "summer"; try { savedSeason = localStorage.getItem("fidget-grass-season") || "summer"; } catch (e) {}
setSeason(SEASONS[savedSeason] ? savedSeason : "summer");

/* ================= loop + resize ================= */
window.addEventListener("resize", () => { if (mode === "dice" && D.ready) diceResize(); if (mode === "slime") slimeSetup(false); if (mode === "bubbles") layoutBubbles(false); if (mode === "grass") grassSetup(false); });
// silence everything (including the slime squish bed) while the app is in the background
document.addEventListener("visibilitychange", () => {
  if (!actx) return;
  if (document.hidden) actx.suspend(); else actx.resume();
});
slimeSetup(true);
let savedMode = null; try { savedMode = localStorage.getItem("fidget-mode"); } catch (e) {}
if (location.hash.length > 1) savedMode = location.hash.slice(1); // index.html#dice opens a mode directly when previewing in a browser
// wait for the deferred 3D engine scripts in case the last mode was Dice
if (savedMode && savedMode !== "slime" && $("#mode-" + savedMode)) document.addEventListener("DOMContentLoaded", () => setMode(savedMode));
(function loop(now) {
  if (mode === "slime" && N) { slimeStep(now || 0); slimeRender(now || 0); }
  else if (bed) bed.g.gain.setTargetAtTime(0, actx.currentTime, .05);
  if (mode === "dice" && D.ready && !D.failed) { try { diceFrame(now || 0); } catch (e) { diceError(e); } }
  if (mode === "grass" && G.W) grassFrame(now || 0);
  requestAnimationFrame(loop);
})();
})();
</script>
