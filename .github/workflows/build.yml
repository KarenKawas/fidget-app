name: Build apps

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install
      - run: npx cap add android
      - name: App icon and splash
        run: node scripts/make-icons.js && npx capacitor-assets generate --android
      - name: Lock to portrait
        run: sed -i 's/<activity/<activity android:screenOrientation="portrait"/' android/app/src/main/AndroidManifest.xml
      - run: npm run sync
      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: fidget-android
          path: android/app/build/outputs/apk/debug/app-debug.apk

  ios:
    name: iPhone IPA (unsigned)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Prepare the iOS project (icons, portrait, iPhone only, Info.plist keys)
        run: sh scripts/ios-prepare.sh
      - name: Build unsigned IPA
        run: |
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App \
            -configuration Release -sdk iphoneos -derivedDataPath build \
            MARKETING_VERSION=$(node -p "require('./package.json').version") CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qr fidget-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: fidget-iphone
          path: fidget-unsigned.ipa
